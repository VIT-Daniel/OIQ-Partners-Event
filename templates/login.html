<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - VIT Partner Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body { background-color: #f8f9fa; }
    header {
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 0.75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.25rem;
      color: #0d6efd;
      text-decoration: none;
    }
    header .brand img {
      height: 40px;
      width: 40px;
      object-fit: contain;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <a href="/" class="brand">
      <img src="{{ url_for('static', filename='image/vit.png') }}" alt="VIT Logo" />
      <span>VIT Partner Events</span>
    </a>
    <a href="/" class="btn btn-outline-secondary btn-sm">Back</a>
  </header>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4">
            <h4 class="fw-semibold text-center mb-4">Member Login</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, msg in messages %}
                  <div class="alert alert-{{ 'danger' if category=='error' else 'success' }} py-2">
                    {{ msg }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input name="email" type="email" class="form-control" placeholder="you@example.com" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" placeholder="********" required />
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>

              <p class="text-center mt-3 mb-0">
                Remove register for now! 
              </p>
            </form>
          </div>
        </div>

        <p class="text-center text-muted mt-3 small">
          Members can add events after logging in.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
